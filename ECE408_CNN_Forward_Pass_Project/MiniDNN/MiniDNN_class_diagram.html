<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>MiniDNN Class Diagram</title>
<style>
  :root {
    --color-background-primary: #ffffff;
    --color-text-primary: #1a1a18;
    --color-text-secondary: #5f5e5a;
    --color-border-tertiary: rgba(0,0,0,0.15);
    --color-border-secondary: rgba(0,0,0,0.3);
    --font-sans: system-ui, -apple-system, sans-serif;
    --border-radius-lg: 12px;
    --p: #7F77DD; --s: rgba(0,0,0,0.3); --t: rgba(0,0,0,0.5); --bg2: #f5f5f2; --b: rgba(0,0,0,0.15);
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --color-background-primary: #1c1c1a;
      --color-text-primary: #e8e6de;
      --color-text-secondary: #9c9a92;
      --color-border-tertiary: rgba(255,255,255,0.15);
      --color-border-secondary: rgba(255,255,255,0.3);
      --bg2: #2c2c2a;
      --p: #AFA9EC; --s: rgba(255,255,255,0.3); --t: rgba(255,255,255,0.5); --b: rgba(255,255,255,0.15);
    }
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    font-family: var(--font-sans);
    background: var(--color-background-primary);
    color: var(--color-text-primary);
    padding: 32px;
    min-height: 100vh;
  }
  h1 {
    font-size: 18px;
    font-weight: 500;
    color: var(--color-text-primary);
    margin-bottom: 8px;
  }
  p {
    font-size: 13px;
    color: var(--color-text-secondary);
    margin-bottom: 24px;
  }
  .card {
    border: 1px solid var(--color-border-tertiary);
    border-radius: var(--border-radius-lg);
    padding: 24px;
    background: var(--color-background-primary);
  }

  /* SVG pre-built classes */
  svg text { font-family: var(--font-sans); fill: var(--color-text-primary); }
  svg text.t  { font-size: 14px; font-weight: 400; fill: var(--color-text-primary); }
  svg text.ts { font-size: 12px; font-weight: 400; fill: var(--color-text-secondary); }
  svg text.th { font-size: 14px; font-weight: 500; fill: var(--color-text-primary); }
  svg .box { fill: var(--bg2); stroke: var(--b); }
  svg .arr { fill: none; stroke: var(--t); stroke-width: 1.5; }
  svg .leader { fill: none; stroke: var(--t); stroke-width: 0.5; stroke-dasharray: 4 3; }
  svg .node { cursor: pointer; }
  svg .node:hover { opacity: 0.8; }

  /* Color ramps */
  svg .c-purple rect, svg .c-purple circle, svg .c-purple ellipse { fill: #EEEDFE; stroke: #534AB7; }
  svg .c-purple text.th { fill: #3C3489; }
  svg .c-purple text.ts { fill: #534AB7; }
  svg .c-teal rect, svg .c-teal circle, svg .c-teal ellipse { fill: #E1F5EE; stroke: #0F6E56; }
  svg .c-teal text.th { fill: #085041; }
  svg .c-teal text.ts { fill: #0F6E56; }
  svg .c-coral rect, svg .c-coral circle, svg .c-coral ellipse { fill: #FAECE7; stroke: #993C1D; }
  svg .c-coral text.th { fill: #712B13; }
  svg .c-coral text.ts { fill: #993C1D; }
  svg .c-blue rect, svg .c-blue circle, svg .c-blue ellipse { fill: #E6F1FB; stroke: #185FA5; }
  svg .c-blue text.th { fill: #0C447C; }
  svg .c-blue text.ts { fill: #185FA5; }
  svg .c-gray rect, svg .c-gray circle, svg .c-gray ellipse { fill: #F1EFE8; stroke: #5F5E5A; }
  svg .c-gray text.th { fill: #444441; }
  svg .c-gray text.ts { fill: #5F5E5A; }

  @media (prefers-color-scheme: dark) {
    svg .c-purple rect, svg .c-purple circle, svg .c-purple ellipse { fill: #3C3489; stroke: #AFA9EC; }
    svg .c-purple text.th { fill: #EEEDFE; }
    svg .c-purple text.ts { fill: #CECBF6; }
    svg .c-teal rect, svg .c-teal circle, svg .c-teal ellipse { fill: #085041; stroke: #5DCAA5; }
    svg .c-teal text.th { fill: #E1F5EE; }
    svg .c-teal text.ts { fill: #9FE1CB; }
    svg .c-coral rect, svg .c-coral circle, svg .c-coral ellipse { fill: #712B13; stroke: #F0997B; }
    svg .c-coral text.th { fill: #FAECE7; }
    svg .c-coral text.ts { fill: #F5C4B3; }
    svg .c-blue rect, svg .c-blue circle, svg .c-blue ellipse { fill: #0C447C; stroke: #85B7EB; }
    svg .c-blue text.th { fill: #E6F1FB; }
    svg .c-blue text.ts { fill: #B5D4F4; }
    svg .c-gray rect, svg .c-gray circle, svg .c-gray ellipse { fill: #444441; stroke: #B4B2A9; }
    svg .c-gray text.th { fill: #F1EFE8; }
    svg .c-gray text.ts { fill: #D3D1C7; }
  }
</style>
</head>
<body>
<h1>MiniDNN — class diagram</h1>
<p>Architecture overview: Network, Layer hierarchy, Output types, Optimizers, and Activation policies.</p>
<div class="card">
<svg width="100%" viewBox="0 0 680 575" xmlns="http://www.w3.org/2000/svg">
<defs>
  <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
    <path d="M2 1L8 5L2 9" fill="none" stroke="context-stroke" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
  </marker>
  <marker id="inh" viewBox="0 0 14 12" refX="12" refY="6" markerWidth="11" markerHeight="10" orient="auto">
    <polygon points="1,1 12,6 1,11" fill="var(--color-background-primary)" stroke="context-stroke" stroke-width="1.4" stroke-linejoin="round"/>
  </marker>
  <marker id="inhup" viewBox="0 0 12 14" refX="6" refY="12" markerWidth="10" markerHeight="11" orient="auto">
    <polygon points="1,12 6,1 11,12" fill="var(--color-background-primary)" stroke="context-stroke" stroke-width="1.4" stroke-linejoin="round"/>
  </marker>
</defs>

<!-- Network -->
<g class="node c-purple">
  <rect x="140" y="22" width="400" height="56" rx="8" stroke-width="0.5"/>
  <text class="th" x="340" y="44" text-anchor="middle" dominant-baseline="central">Network</text>
  <text class="ts" x="340" y="63" text-anchor="middle" dominant-baseline="central">Builds, trains, and runs the full model</text>
</g>

<!-- Dashed composition arrows from Network -->
<line x1="218" y1="78" x2="128" y2="152" stroke="var(--s)" stroke-width="0.9" stroke-dasharray="5 3" marker-end="url(#arrow)"/>
<line x1="340" y1="78" x2="352" y2="152" stroke="var(--s)" stroke-width="0.9" stroke-dasharray="5 3" marker-end="url(#arrow)"/>
<line x1="474" y1="78" x2="552" y2="152" stroke="var(--s)" stroke-width="0.9" stroke-dasharray="5 3" marker-end="url(#arrow)"/>

<text class="ts" x="155" y="108" text-anchor="middle" style="font-style:italic">layers[ ]</text>
<text class="ts" x="332" y="128" text-anchor="middle" style="font-style:italic">output</text>
<text class="ts" x="524" y="108" text-anchor="middle" style="font-style:italic">optimizer</text>

<!-- Layer abstract -->
<g class="node c-teal">
  <rect x="28" y="152" width="188" height="56" rx="8" stroke-width="0.5"/>
  <text class="th" x="122" y="173" text-anchor="middle" dominant-baseline="central">Layer</text>
  <text class="ts" x="122" y="192" text-anchor="middle" dominant-baseline="central">«abstract» forward / backprop</text>
</g>

<!-- Output abstract -->
<g class="node c-coral">
  <rect x="252" y="152" width="195" height="56" rx="8" stroke-width="0.5"/>
  <text class="th" x="349" y="173" text-anchor="middle" dominant-baseline="central">Output</text>
  <text class="ts" x="349" y="192" text-anchor="middle" dominant-baseline="central">«abstract» loss + gradient</text>
</g>

<!-- Optimizer abstract -->
<g class="node c-blue">
  <rect x="470" y="152" width="170" height="56" rx="8" stroke-width="0.5"/>
  <text class="th" x="555" y="173" text-anchor="middle" dominant-baseline="central">Optimizer</text>
  <text class="ts" x="555" y="192" text-anchor="middle" dominant-baseline="central">«abstract» update rule</text>
</g>

<!-- Layer inheritance trunk -->
<line x1="242" y1="180" x2="216" y2="180" stroke="var(--t)" stroke-width="0.9" marker-end="url(#inh)"/>
<line x1="242" y1="180" x2="242" y2="468" stroke="var(--t)" stroke-width="0.9"/>
<line x1="242" y1="312" x2="216" y2="312" stroke="var(--t)" stroke-width="0.9"/>
<line x1="242" y1="376" x2="216" y2="376" stroke="var(--t)" stroke-width="0.9"/>
<line x1="242" y1="442" x2="216" y2="442" stroke="var(--t)" stroke-width="0.9"/>

<!-- Layer subclasses -->
<g class="node c-teal">
  <rect x="28" y="286" width="188" height="52" rx="8" stroke-width="0.5"/>
  <text class="th" x="122" y="306" text-anchor="middle" dominant-baseline="central">FullyConnected</text>
  <text class="ts" x="122" y="325" text-anchor="middle" dominant-baseline="central">&lt;Activation&gt;</text>
</g>

<g class="node c-teal">
  <rect x="28" y="350" width="188" height="52" rx="8" stroke-width="0.5"/>
  <text class="th" x="122" y="370" text-anchor="middle" dominant-baseline="central">Convolutional</text>
  <text class="ts" x="122" y="389" text-anchor="middle" dominant-baseline="central">&lt;Activation&gt;</text>
</g>

<g class="node c-teal">
  <rect x="28" y="416" width="188" height="52" rx="8" stroke-width="0.5"/>
  <text class="th" x="122" y="436" text-anchor="middle" dominant-baseline="central">MaxPooling</text>
  <text class="ts" x="122" y="455" text-anchor="middle" dominant-baseline="central">&lt;Activation&gt;</text>
</g>

<!-- Output inheritance trunk -->
<line x1="458" y1="180" x2="447" y2="180" stroke="var(--t)" stroke-width="0.9" marker-end="url(#inh)"/>
<line x1="458" y1="180" x2="458" y2="452" stroke="var(--t)" stroke-width="0.9"/>
<line x1="458" y1="307" x2="437" y2="307" stroke="var(--t)" stroke-width="0.9"/>
<line x1="458" y1="367" x2="437" y2="367" stroke="var(--t)" stroke-width="0.9"/>
<line x1="458" y1="427" x2="437" y2="427" stroke="var(--t)" stroke-width="0.9"/>

<!-- Output subclasses -->
<g class="node c-coral">
  <rect x="252" y="285" width="185" height="44" rx="8" stroke-width="0.5"/>
  <text class="th" x="344" y="307" text-anchor="middle" dominant-baseline="central">RegressionMSE</text>
</g>

<g class="node c-coral">
  <rect x="252" y="345" width="185" height="44" rx="8" stroke-width="0.5"/>
  <text class="th" x="344" y="367" text-anchor="middle" dominant-baseline="central">BinaryClassEntropy</text>
</g>

<g class="node c-coral">
  <rect x="252" y="405" width="185" height="44" rx="8" stroke-width="0.5"/>
  <text class="th" x="344" y="427" text-anchor="middle" dominant-baseline="central">MultiClassEntropy</text>
</g>

<!-- Optimizer V-shape inheritance -->
<line x1="513" y1="285" x2="513" y2="252" stroke="var(--t)" stroke-width="0.9"/>
<line x1="601" y1="285" x2="601" y2="252" stroke="var(--t)" stroke-width="0.9"/>
<line x1="513" y1="252" x2="601" y2="252" stroke="var(--t)" stroke-width="0.9"/>
<line x1="557" y1="252" x2="557" y2="208" stroke="var(--t)" stroke-width="0.9" marker-end="url(#inhup)"/>

<!-- Optimizer subclasses -->
<g class="node c-blue">
  <rect x="472" y="285" width="82" height="44" rx="8" stroke-width="0.5"/>
  <text class="th" x="513" y="307" text-anchor="middle" dominant-baseline="central">SGD</text>
</g>

<g class="node c-blue">
  <rect x="563" y="285" width="82" height="44" rx="8" stroke-width="0.5"/>
  <text class="th" x="604" y="307" text-anchor="middle" dominant-baseline="central">Adam</text>
</g>

<!-- Activations section -->
<rect x="38" y="480" width="460" height="58" rx="8" stroke="var(--s)" stroke-width="0.8" stroke-dasharray="6 3" fill="none"/>
<text class="ts" x="268" y="496" text-anchor="middle" style="font-style:italic">Activation functions — template parameter for layer types</text>

<g class="node c-gray">
  <rect x="50" y="502" width="62" height="28" rx="6" stroke-width="0.5"/>
  <text class="ts" x="81" y="516" text-anchor="middle" dominant-baseline="central">ReLU</text>
</g>
<g class="node c-gray">
  <rect x="120" y="502" width="74" height="28" rx="6" stroke-width="0.5"/>
  <text class="ts" x="157" y="516" text-anchor="middle" dominant-baseline="central">Identity</text>
</g>
<g class="node c-gray">
  <rect x="202" y="502" width="70" height="28" rx="6" stroke-width="0.5"/>
  <text class="ts" x="237" y="516" text-anchor="middle" dominant-baseline="central">Sigmoid</text>
</g>
<g class="node c-gray">
  <rect x="280" y="502" width="58" height="28" rx="6" stroke-width="0.5"/>
  <text class="ts" x="309" y="516" text-anchor="middle" dominant-baseline="central">Tanh</text>
</g>
<g class="node c-gray">
  <rect x="346" y="502" width="74" height="28" rx="6" stroke-width="0.5"/>
  <text class="ts" x="383" y="516" text-anchor="middle" dominant-baseline="central">Softmax</text>
</g>

<!-- Legend -->
<line x1="510" y1="498" x2="532" y2="498" stroke="var(--s)" stroke-width="0.9" stroke-dasharray="5 3" marker-end="url(#arrow)"/>
<text class="ts" x="538" y="502" dominant-baseline="central">has / uses</text>
<line x1="510" y1="522" x2="532" y2="522" stroke="var(--t)" stroke-width="0.9" marker-end="url(#inh)"/>
<text class="ts" x="538" y="526" dominant-baseline="central">inherits</text>
</svg>
</div>
</body>
</html>
